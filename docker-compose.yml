# Local stack: Postgres + Keycloak + API. Run the frontend with `npm run dev` (see Makefile `dev`),
# which proxies /api and /auth so the browser sees one origin, like the cluster ingress.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pgnexus
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      POSTGRES_DB: pgnexus
    ports: ["55432:5432"]
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./k8s/base/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pgnexus"]
      interval: 5s
      retries: 20

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.4
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD:?set in .env}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: pgnexus
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD}
      KC_HTTP_RELATIVE_PATH: /auth
      KC_HOSTNAME: http://localhost:3000/auth
      KC_HEALTH_ENABLED: "true"
      APP_URL: http://localhost:3000
      DEMO_PG_PASSWORD: ${DEMO_PG_PASSWORD:?set in .env}
      DEMO_SUP_PASSWORD: ${DEMO_SUP_PASSWORD:?set in .env}
    ports: ["8180:8080"]
    volumes:
      - ./k8s/base/keycloak/pgnexus-realm.json:/opt/keycloak/data/import/pgnexus-realm.json:ro
    depends_on:
      postgres: { condition: service_healthy }

  backend:
    build: ./backend
    command: ["sh", "-c", "alembic upgrade head && python -m scripts.seed && uvicorn app.main:app --host 0.0.0.0 --port 8000"]
    environment:
      DATABASE_URL: postgresql+asyncpg://pgnexus:${POSTGRES_PASSWORD}@postgres:5432/pgnexus
      KEYCLOAK_ISSUER: http://localhost:3000/auth/realms/pgnexus
      KEYCLOAK_JWKS_URL: http://keycloak:8080/auth/realms/pgnexus/protocol/openid-connect/certs
      DEBUG: "true"
    ports: ["8000:8000"]
    depends_on:
      postgres: { condition: service_healthy }

volumes:
  pg_data:
