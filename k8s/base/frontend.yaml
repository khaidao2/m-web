apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: pgnexus
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
      - name: frontend
        image: pgnexus/frontend:latest
        imagePullPolicy: IfNotPresent
        env:
        - name: NEXT_PUBLIC_API_URL
          value: "http://pgnexus.local"
        - name: NEXT_PUBLIC_KEYCLOAK_URL
          value: "http://auth.pgnexus.local:30180"
        - name: NEXT_PUBLIC_KEYCLOAK_REALM
          value: "pgnexus"
        - name: NEXT_PUBLIC_KEYCLOAK_CLIENT_ID
          value: "pgnexus-frontend"
        ports:
        - containerPort: 3000
        readinessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 5
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: pgnexus
spec:
  type: NodePort
  selector:
    app: frontend
  ports:
    - port: 3000
      targetPort: 3000
      nodePort: 30000
