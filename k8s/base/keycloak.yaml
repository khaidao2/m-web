apiVersion: v1
kind: Service
metadata:
  name: keycloak
spec:
  selector: { app: keycloak }
  ports: [{ name: http, port: 8080, targetPort: 8080 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
spec:
  replicas: 1
  selector:
    matchLabels: { app: keycloak }
  template:
    metadata:
      labels: { app: keycloak }
    spec:
      containers:
        - name: keycloak
          image: quay.io/keycloak/keycloak:26.7.4
          args: ["start", "--import-realm"]
          env:
            - { name: KC_DB, value: postgres }
            - { name: KC_DB_URL, value: "jdbc:postgresql://postgres:5432/keycloak" }
            - { name: KC_DB_USERNAME, value: pgnexus }
            - name: KC_DB_PASSWORD
              valueFrom: { secretKeyRef: { name: pgnexus-secrets, key: POSTGRES_PASSWORD } }
            - { name: KC_BOOTSTRAP_ADMIN_USERNAME, value: admin }
            - name: KC_BOOTSTRAP_ADMIN_PASSWORD
              valueFrom: { secretKeyRef: { name: pgnexus-secrets, key: KC_ADMIN_PASSWORD } }
            - { name: KC_HTTP_ENABLED, value: "true" }
            - { name: KC_HTTP_RELATIVE_PATH, value: /auth }
            - { name: KC_PROXY_HEADERS, value: xforwarded }
            - { name: KC_HEALTH_ENABLED, value: "true" }
            - { name: KC_HOSTNAME, valueFrom: { configMapKeyRef: { name: pgnexus-config, key: KEYCLOAK_PUBLIC_URL } } }
            - { name: APP_URL, valueFrom: { configMapKeyRef: { name: pgnexus-config, key: APP_URL } } }
            - name: DEMO_PG_PASSWORD
              valueFrom: { secretKeyRef: { name: pgnexus-secrets, key: DEMO_PG_PASSWORD } }
            - name: DEMO_SUP_PASSWORD
              valueFrom: { secretKeyRef: { name: pgnexus-secrets, key: DEMO_SUP_PASSWORD } }
          ports:
            - { name: http, containerPort: 8080 }
            - { name: management, containerPort: 9000 }
          startupProbe:
            httpGet: { path: /auth/health/started, port: management }
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet: { path: /auth/health/ready, port: management }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /auth/health/live, port: management }
            periodSeconds: 20
          resources:
            requests: { cpu: 200m, memory: 512Mi }
            limits: { memory: 1Gi }
          volumeMounts:
            - { name: realm, mountPath: /opt/keycloak/data/import, readOnly: true }
      volumes:
        - name: realm
          configMap: { name: keycloak-realm }
