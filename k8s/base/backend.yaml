apiVersion: v1
kind: Service
metadata:
  name: backend
spec:
  selector: { app: backend }
  ports: [{ port: 8000, targetPort: 8000 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
spec:
  replicas: 1
  selector:
    matchLabels: { app: backend }
  template:
    metadata:
      labels: { app: backend }
    spec:
      initContainers:
        - name: migrate
          image: pgnexus-backend
          command: ["sh", "-c", "alembic upgrade head && python -m scripts.seed"]
          env: &env
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: pgnexus-secrets, key: POSTGRES_PASSWORD } }
            - { name: DATABASE_URL, value: "postgresql+asyncpg://pgnexus:$(POSTGRES_PASSWORD)@postgres:5432/pgnexus" }
            - { name: KEYCLOAK_JWKS_URL, value: "http://keycloak:8080/auth/realms/pgnexus/protocol/openid-connect/certs" }
            - { name: KEYCLOAK_ISSUER, valueFrom: { configMapKeyRef: { name: pgnexus-config, key: KEYCLOAK_ISSUER } } }
      containers:
        - name: backend
          image: pgnexus-backend
          env: *env
          ports: [{ containerPort: 8000 }]
          readinessProbe:
            httpGet: { path: /api/v1/health, port: 8000 }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /api/v1/health, port: 8000 }
            initialDelaySeconds: 20
            periodSeconds: 30
          resources:
            requests: { cpu: 100m, memory: 192Mi }
            limits: { memory: 512Mi }
          securityContext: { allowPrivilegeEscalation: false, runAsNonRoot: true }
