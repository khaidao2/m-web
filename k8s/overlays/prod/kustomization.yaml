# Production on the k3s cluster (fedora control plane + fedora-1 worker), synced by Argo CD.
# CI updates the image tags below on every push to main.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- ../../base
configMapGenerator:
- literals:
  - APP_URL=https://masan-lms.sentpul.click
  - KEYCLOAK_PUBLIC_URL=https://masan-lms.sentpul.click/auth
  - KEYCLOAK_ISSUER=https://masan-lms.sentpul.click/auth/realms/pgnexus
  name: pgnexus-config
patches:
- patch: |-
    - op: replace
      path: /spec/rules/0/host
      value: masan-lms.sentpul.click
  target:
    kind: Ingress
    name: pgnexus
images:
- name: pgnexus-backend
  newName: ghcr.io/khaidao2/m-web-backend
  newTag: 2225e4d67d9c5dc0ac449faae4a6b76efa066bd2
- name: pgnexus-frontend
  newName: ghcr.io/khaidao2/m-web-frontend
  newTag: 2225e4d67d9c5dc0ac449faae4a6b76efa066bd2
