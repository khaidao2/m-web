name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: pgnexus, POSTGRES_PASSWORD: pgnexus, POSTGRES_DB: pgnexus_test }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U pgnexus" --health-interval 5s --health-retries 20
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.13", cache: pip, cache-dependency-path: backend/requirements-dev.txt }
      - run: pip install -r requirements-dev.txt
      - run: ruff check app tests scripts
      # migrations first, on the still-empty database; the test fixture recreates tables itself
      - name: migrations apply cleanly
        run: alembic upgrade head
        env: { DATABASE_URL: "postgresql+asyncpg://pgnexus:pgnexus@localhost:5432/pgnexus_test" }
      - run: pytest -q
        env: { TEST_DATABASE_URL: "postgresql+asyncpg://pgnexus:pgnexus@localhost:5432/pgnexus_test" }

  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 24, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

  manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: render prod overlay
        run: |
          kubectl kustomize k8s/overlays/prod > rendered.yaml
          # every generated ConfigMap must be referenced by its hashed name
          if grep -nE "name: (pgnexus-config|keycloak-realm|postgres-init)$" rendered.yaml; then
            echo "::error::unhashed ConfigMap reference in rendered manifests"; exit 1
          fi

  images:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [backend, frontend, manifests]
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: write }
    strategy:
      matrix: { service: [backend, frontend] }
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.service }}
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/m-web-${{ matrix.service }}:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/m-web-${{ matrix.service }}:latest
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  # GitOps hand-off: pin the new images in the prod overlay; Argo CD rolls them out.
  release:
    needs: images
    runs-on: ubuntu-latest
    permissions: { contents: write }
    concurrency: { group: release, cancel-in-progress: false }
    steps:
      - uses: actions/checkout@v5
        with: { ref: main }
      - uses: imranismail/setup-kustomize@v2
      - working-directory: k8s/overlays/prod
        run: |
          kustomize edit set image \
            pgnexus-backend=ghcr.io/${{ github.repository_owner }}/m-web-backend:${{ github.sha }} \
            pgnexus-frontend=ghcr.io/${{ github.repository_owner }}/m-web-frontend:${{ github.sha }}
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "deploy: ${GITHUB_SHA::7} to prod [skip ci]" || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
